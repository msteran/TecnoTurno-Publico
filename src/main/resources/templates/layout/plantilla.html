<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${titulo}+' | TecnoTurno'">TecnoTurno</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">◉ TecnoTurno</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Abrir menú"><span class="navbar-toggler-icon"></span></button><div id="menu" class="collapse navbar-collapse"><div class="navbar-nav me-auto"><a class="nav-link" th:href="@{/ordenes}">Órdenes</a><a sec:authorize="hasRole('ADMIN')" class="nav-link" th:href="@{/usuarios}">Usuarios</a><a sec:authorize="hasRole('ADMIN')" class="nav-link" th:href="@{/equipos}">Equipos</a></div><span class="text-white small me-3" sec:authentication="name"></span><form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm">Cerrar sesión</button></form></div></div></nav>
<div th:fragment="mensajes"><div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert"><span th:text="${success}"></span><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button></div><div th:if="${warning}" class="alert alert-warning alert-dismissible fade show" role="alert"><span th:text="${warning}"></span><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button></div></div>
<div th:fragment="errores" th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><strong>Revise los datos</strong><ul class="mb-0"><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div>
<footer th:fragment="footer" class="container py-4 mt-5 border-top text-secondary small"><p>TecnoTurno · Gestión de reparaciones · Proyecto académico UTS</p><p>Manuel Santiago Terán Suárez y Harvic Edisson Quintero Cáceres</p><script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script></footer></body></html>
