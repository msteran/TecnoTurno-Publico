<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{layout/plantilla :: head('Equipo')}"></head><body><nav th:replace="~{layout/plantilla :: header}"></nav><main class="container"><h1 th:text="${id==null?'Registrar equipo':'Editar equipo'}"></h1><form class="card p-4 form-box" th:action="${id==null}?@{/equipos/nuevo}:@{/equipos/{id}/editar(id=${id})}" method="post" th:object="${form}"><div th:replace="~{layout/plantilla :: errores}"></div><div class="mb-3"><label for="clienteId" class="form-label">Cliente propietario</label><select id="clienteId" th:field="*{clienteId}" class="form-select" th:errorclass="is-invalid"><option value="">Seleccione</option><option th:each="c:${clientes}" th:value="${c.id}" th:text="${c.nombre}"></option></select><div class="invalid-feedback" th:errors="*{clienteId}"></div></div><div class="mb-3"><label for="tipo" class="form-label">Tipo de equipo</label><input id="tipo" type="text" th:field="*{tipo}" class="form-control" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{tipo}"></div></div><div class="mb-3"><label for="marca" class="form-label">Marca</label><input id="marca" type="text" th:field="*{marca}" class="form-control" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{marca}"></div></div><div class="mb-3"><label for="modelo" class="form-label">Modelo</label><input id="modelo" type="text" th:field="*{modelo}" class="form-control" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{modelo}"></div></div><div class="mb-3"><label for="serial" class="form-label">Serial único</label><input id="serial" type="text" th:field="*{serial}" class="form-control" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{serial}"></div></div><div class="mb-3"><label for="accesorios" class="form-label">Accesorios recibidos</label><textarea id="accesorios" th:field="*{accesorios}" class="form-control" rows="3" th:errorclass="is-invalid"></textarea><div class="invalid-feedback" th:errors="*{accesorios}"></div></div><div><button class="btn btn-primary">Guardar</button> <a class="btn btn-light" th:href="@{/equipos}">Cancelar</a></div></form></main><footer th:replace="~{layout/plantilla :: footer}"></footer></body></html>
