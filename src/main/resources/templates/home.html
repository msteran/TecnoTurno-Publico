<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{layout/plantilla :: head('Inicio')}"></head><body><nav th:replace="~{layout/plantilla :: header}"></nav><main class="container"><div th:replace="~{layout/plantilla :: mensajes}"></div><div class="d-flex justify-content-between flex-wrap gap-3 mb-4"><div><p class="eyebrow">CONTROL DEL TALLER</p><h1>Panel de reparaciones</h1><p class="text-secondary">Consulte el avance y el historial de sus órdenes.</p></div><a sec:authorize="hasRole('ADMIN')" class="btn btn-primary align-self-start" th:href="@{/ordenes/nueva}">Registrar reparación</a></div><div class="row g-3 mb-5"><div class="col-md-4"><div class="card metric"><span>Total de órdenes</span><strong th:text="${total}"></strong></div></div><div class="col-md-4"><div class="card metric"><span>En proceso</span><strong th:text="${abiertas}"></strong></div></div><div class="col-md-4"><div class="card metric"><span>Listas para entregar</span><strong th:text="${listas}"></strong></div></div></div><h2 class="h4">Órdenes recientes</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Orden</th><th>Cliente</th><th>Equipo</th><th>Estado</th><th>Técnico</th><th></th></tr></thead><tbody><tr th:each="o : ${recientes}"><td th:text="'OT-'+${o.id}"></td><td th:text="${o.equipo.cliente.nombre}"></td><td><span th:text="${o.equipo.marca}"></span> <span th:text="${o.equipo.modelo}"></span><small class="d-block text-secondary" th:text="${o.equipo.serial}"></small></td><td><span class="badge text-bg-light" th:text="${#strings.replace(o.estado.name(),'_',' ')}"></span></td><td th:text="${o.tecnico.nombre}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/ordenes/{id}(id=${o.id})}">Ver</a></td></tr><tr th:if="${#lists.isEmpty(recientes)}"><td colspan="6" class="text-center py-4 text-secondary">No hay órdenes para mostrar.</td></tr></tbody></table></div></main><footer th:replace="~{layout/plantilla :: footer}"></footer></body></html>
