<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{layout/plantilla :: head('Ingresar')}"></head><body><main class="container"><div class="login-box mx-auto"><div class="eyebrow">TALLER TECNOLÓGICO</div><h1 class="display-6 fw-bold">TecnoTurno</h1><p class="text-secondary">Cada reparación, con su historia.</p><div th:if="${param.error}" class="alert alert-danger">Correo o contraseña incorrectos, o cuenta inactiva.</div><div th:if="${param.logout}" class="alert alert-success">Sesión cerrada.</div><form th:action="@{/login}" method="post"><label class="form-label" for="username">Correo electrónico</label><input id="username" name="username" type="email" class="form-control mb-3" required autocomplete="username"><label class="form-label" for="password">Contraseña</label><input id="password" name="password" type="password" class="form-control mb-4" required autocomplete="current-password"><button class="btn btn-primary w-100">Ingresar</button></form><p class="small text-secondary mt-4">Solicite su cuenta al administrador del taller.</p></div></main><footer th:replace="~{layout/plantilla :: footer}"></footer></body></html>
