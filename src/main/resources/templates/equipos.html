<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{layout/plantilla :: head('Equipos')}"></head><body><nav th:replace="~{layout/plantilla :: header}"></nav><main class="container"><div th:replace="~{layout/plantilla :: mensajes}"></div><div class="d-flex justify-content-between mb-4"><h1>Equipos</h1><a class="btn btn-primary align-self-start" th:href="@{/equipos/nuevo}">Nuevo equipo</a></div><div class="table-responsive"><table class="table"><thead><tr><th>Serial</th><th>Equipo</th><th>Propietario</th><th>Acciones</th></tr></thead><tbody><tr th:each="e:${equipos}"><td th:text="${e.serial}"></td><td th:text="${e.marca+' '+e.modelo}"></td><td th:text="${e.cliente.nombre}"></td><td><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/equipos/{id}/editar(id=${e.id})}">Editar</a><form th:action="@{/equipos/{id}/eliminar(id=${e.id})}" method="post" onsubmit="return confirm('¿Eliminar este equipo? Solo se eliminará si no tiene órdenes.');"><button class="btn btn-sm btn-outline-danger">Eliminar</button></form></div></td></tr><tr th:if="${#lists.isEmpty(equipos)}"><td colspan="4">Registre su primer equipo.</td></tr></tbody></table></div></main><footer th:replace="~{layout/plantilla :: footer}"></footer></body></html>
