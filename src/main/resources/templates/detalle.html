<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{layout/plantilla :: head('Detalle de reparación')}"></head><body><nav th:replace="~{layout/plantilla :: header}"></nav><main class="container"><div th:replace="~{layout/plantilla :: mensajes}"></div><h1 th:text="'Orden OT-'+${orden.id}"></h1><p class="text-secondary" th:text="${#strings.replace(orden.estado.name(),'_',' ')}"></p><div class="row g-4"><div class="col-lg-5"><div class="card p-4"><h2 class="h5">Recepción</h2><dl><dt>Cliente</dt><dd th:text="${orden.equipo.cliente.nombre}"></dd><dt>Equipo y serial</dt><dd th:text="${orden.equipo.marca+' '+orden.equipo.modelo+' · '+orden.equipo.serial}"></dd><dt>Accesorios</dt><dd th:text="${orden.equipo.accesorios}"></dd><dt>Técnico</dt><dd th:text="${orden.tecnico.nombre}"></dd><dt>Falla reportada</dt><dd class="preserve" th:text="${orden.falla}"></dd><dt>Ingreso</dt><dd th:text="${#temporals.format(orden.creada,'dd/MM/yyyy HH:mm')}"></dd><dt>Diagnóstico</dt><dd class="preserve" th:text="${#strings.isEmpty(orden.diagnostico)?'Pendiente':orden.diagnostico}"></dd><dt>Costo registrado en COP</dt><dd th:text="${#numbers.formatDecimal(orden.costo,1,'POINT',2,'COMMA')}"></dd></dl></div></div><div class="col-lg-7"><form th:if="${puedeEditar}" class="card p-4 mb-4" th:action="@{/ordenes/{id}(id=${orden.id})}" method="post" th:object="${form}"><h2 class="h5">Actualizar reparación</h2><div th:replace="~{layout/plantilla :: errores}"></div><input type="hidden" th:field="*{version}"><div class="mb-3"><label for="estado" class="form-label">Estado</label><select id="estado" th:field="*{estado}" class="form-select" th:errorclass="is-invalid"><option value="">Seleccione</option><option th:each="e:${siguientes}" th:value="${e}" th:text="${#strings.replace(e.name(),'_',' ')}"></option></select><div class="invalid-feedback" th:errors="*{estado}"></div></div><div class="mb-3"><label for="diagnostico" class="form-label">Diagnóstico técnico</label><textarea id="diagnostico" th:field="*{diagnostico}" class="form-control" rows="3" th:errorclass="is-invalid"></textarea><div class="invalid-feedback" th:errors="*{diagnostico}"></div></div><div class="mb-3"><label for="costo" class="form-label">Costo en COP</label><input id="costo" type="number" min="0" step="0.01" th:field="*{costo}" class="form-control" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{costo}"></div></div><div class="mb-3"><label for="nota" class="form-label">Descripción de esta actualización</label><textarea id="nota" th:field="*{nota}" class="form-control" rows="3" th:errorclass="is-invalid"></textarea><div class="invalid-feedback" th:errors="*{nota}"></div></div><button class="btn btn-primary">Guardar actualización</button></form><div class="card p-4"><h2 class="h5">Historial</h2><article class="history" th:each="h:${historial}"><strong th:text="${#strings.replace(h.estado.name(),'_',' ')}"></strong><small class="d-block text-secondary" th:text="${#temporals.format(h.fecha,'dd/MM/yyyy HH:mm')+' · '+h.responsable.nombre}"></small><p class="preserve mb-0" th:text="${h.nota}"></p></article></div></div></div></main><footer th:replace="~{layout/plantilla :: footer}"></footer></body></html>
