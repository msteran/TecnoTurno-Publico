<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{layout/plantilla :: head('Órdenes')}"></head><body><nav th:replace="~{layout/plantilla :: header}"></nav><main class="container"><div th:replace="~{layout/plantilla :: mensajes}"></div><h1>Órdenes de servicio</h1><form class="row g-2 my-3" method="get" th:action="@{/ordenes}"><div class="col-md-6"><label class="form-label" for="q">Orden, serial o cliente</label><input id="q" name="q" th:value="${q}" class="form-control" placeholder="Buscar"></div><div class="col-md-4"><label for="estado" class="form-label">Estado</label><select id="estado" name="estado" class="form-select"><option value="">Todos</option><option th:each="e:${estados}" th:value="${e}" th:text="${#strings.replace(e.name(),'_',' ')}" th:selected="${e==estadoSeleccionado}"></option></select></div><div class="col-md-2 align-self-end"><button class="btn btn-primary w-100">Filtrar</button></div></form><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Orden</th><th>Cliente</th><th>Equipo</th><th>Estado</th><th>Técnico</th><th></th></tr></thead><tbody><tr th:each="o : ${ordenes}"><td th:text="'OT-'+${o.id}"></td><td th:text="${o.equipo.cliente.nombre}"></td><td><span th:text="${o.equipo.marca}"></span> <span th:text="${o.equipo.modelo}"></span><small class="d-block text-secondary" th:text="${o.equipo.serial}"></small></td><td><span class="badge text-bg-light" th:text="${#strings.replace(o.estado.name(),'_',' ')}"></span></td><td th:text="${o.tecnico.nombre}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/ordenes/{id}(id=${o.id})}">Ver</a></td></tr><tr th:if="${#lists.isEmpty(ordenes)}"><td colspan="6" class="text-center py-4 text-secondary">No hay órdenes para mostrar.</td></tr></tbody></table></div></main><footer th:replace="~{layout/plantilla :: footer}"></footer></body></html>
