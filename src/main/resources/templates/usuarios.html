<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{layout/plantilla :: head('Usuarios')}"></head><body><nav th:replace="~{layout/plantilla :: header}"></nav><main class="container"><div th:replace="~{layout/plantilla :: mensajes}"></div><div class="d-flex justify-content-between mb-4"><h1>Usuarios</h1><a class="btn btn-primary align-self-start" th:href="@{/usuarios/nuevo}">Nuevo usuario</a></div><div class="table-responsive"><table class="table"><thead><tr><th>Nombre</th><th>Correo</th><th>Perfil</th><th>Activo</th><th></th></tr></thead><tbody><tr th:each="u:${usuarios}"><td th:text="${u.nombre}"></td><td th:text="${u.email}"></td><td th:text="${u.rol}"></td><td th:text="${u.activo?'Sí':'No'}"></td><td><a th:href="@{/usuarios/{id}/editar(id=${u.id})}" class="btn btn-sm btn-outline-primary">Editar</a></td></tr></tbody></table></div></main><footer th:replace="~{layout/plantilla :: footer}"></footer></body></html>
