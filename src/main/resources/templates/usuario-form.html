<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{layout/plantilla :: head('Usuario')}"></head><body><nav th:replace="~{layout/plantilla :: header}"></nav><main class="container"><h1 th:text="${id==null?'Registrar usuario':'Editar usuario'}"></h1><form class="card p-4 form-box" th:action="${id==null}?@{/usuarios/nuevo}:@{/usuarios/{id}/editar(id=${id})}" th:object="${form}" method="post"><div th:replace="~{layout/plantilla :: errores}"></div><div class="mb-3"><label for="nombre" class="form-label">Nombre completo</label><input id="nombre" type="text" th:field="*{nombre}" class="form-control" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{nombre}"></div></div><div class="mb-3"><label for="documento" class="form-label">Documento</label><input id="documento" type="text" th:field="*{documento}" class="form-control" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{documento}"></div></div><div class="mb-3"><label for="email" class="form-label">Correo</label><input id="email" type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{email}"></div></div><div class="mb-3"><label for="telefono" class="form-label">Teléfono</label><input id="telefono" type="text" th:field="*{telefono}" class="form-control" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{telefono}"></div></div><div class="mb-3"><label for="rol" class="form-label">Perfil</label><select id="rol" th:field="*{rol}" class="form-select" th:errorclass="is-invalid"><option value="">Seleccione</option><option th:each="r:${roles}" th:value="${r}" th:text="${r}"></option></select><div class="invalid-feedback" th:errors="*{rol}"></div></div><div class="mb-3"><label for="password" class="form-label">Contraseña (mínimo 8 caracteres; vacía al editar conserva la actual)</label><input id="password" type="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{password}"></div></div><div class="form-check mb-3"><input id="activo" th:field="*{activo}" type="checkbox" class="form-check-input"><label for="activo" class="form-check-label">Cuenta activa</label></div><div><button class="btn btn-primary">Guardar</button> <a class="btn btn-light" th:href="@{/usuarios}">Cancelar</a></div></form></main><footer th:replace="~{layout/plantilla :: footer}"></footer></body></html>
