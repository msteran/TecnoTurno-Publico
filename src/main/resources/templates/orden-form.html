<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{layout/plantilla :: head('Registrar reparación')}"></head><body><nav th:replace="~{layout/plantilla :: header}"></nav><main class="container"><h1>Registrar reparación</h1><p class="text-secondary">Registre primero el cliente, el equipo y una cuenta de técnico.</p><form class="card p-4 form-box" th:action="@{/ordenes/nueva}" method="post" th:object="${form}"><div th:replace="~{layout/plantilla :: errores}"></div><div class="mb-3"><label for="equipoId" class="form-label">Equipo</label><select id="equipoId" th:field="*{equipoId}" class="form-select" th:errorclass="is-invalid"><option value="">Seleccione</option><option th:each="e:${equipos}" th:value="${e.id}" th:text="${e.serial+' · '+e.cliente.nombre}"></option></select><div class="invalid-feedback" th:errors="*{equipoId}"></div></div><div class="mb-3"><label for="tecnicoId" class="form-label">Técnico responsable</label><select id="tecnicoId" th:field="*{tecnicoId}" class="form-select" th:errorclass="is-invalid"><option value="">Seleccione</option><option th:each="t:${tecnicos}" th:value="${t.id}" th:text="${t.nombre}"></option></select><div class="invalid-feedback" th:errors="*{tecnicoId}"></div></div><div class="mb-3"><label for="falla" class="form-label">Falla reportada</label><textarea id="falla" th:field="*{falla}" class="form-control" rows="3" th:errorclass="is-invalid"></textarea><div class="invalid-feedback" th:errors="*{falla}"></div></div><div><button class="btn btn-primary">Registrar</button> <a class="btn btn-light" th:href="@{/ordenes}">Cancelar</a></div></form></main><footer th:replace="~{layout/plantilla :: footer}"></footer></body></html>
